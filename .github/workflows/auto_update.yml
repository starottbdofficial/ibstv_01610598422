name: Auto Update M3U Playlist

on:
  schedule:
    # প্রতি ১ ঘণ্টা পর পর অটোমেটিক চলবে (Cron syntax)
    - cron: '0 * * * *'
  workflow_dispatch: # চাইলে ম্যানুয়ালি রান করার অপশন

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script to generate playlist
        run: python convert.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add playlist.m3u
          git status
          git diff-index --quiet HEAD || (git commit -m "Auto update playlist [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" && git push)
